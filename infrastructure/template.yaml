AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FreshGuard telemetry, incident lifecycle, alerting and read API foundation

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: '[a-z][a-z0-9-]{0,19}'
  AllowedWebOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Exact browser origins allowed to call the public read API

Resources:
  DevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FreshGuardDevices-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH

  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FreshGuardTelemetry-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: sampleKey
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: sampleKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FreshGuardIncidents-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: openedAt
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByDeviceOpenedAt
          KeySchema:
            - AttributeName: deviceId
              KeyType: HASH
            - AttributeName: openedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TelemetryHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/freshguard-${Stage}-telemetry-handler
      RetentionInDays: 7

  TelemetryHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TelemetryIngestion
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt TelemetryTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DevicesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt DevicesTable.Arn
                  - !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/freshguard-${Stage}-telemetry-handler:log-stream:*

  TelemetryHandler:
    Type: AWS::Serverless::Function
    DependsOn: TelemetryHandlerLogGroup
    Metadata:
      # pnpm/esbuild builds the workspace imports before SAM packages this directory.
      SkipBuild: true
    Properties:
      FunctionName: !Sub freshguard-${Stage}-telemetry-handler
      CodeUri: ../services/telemetry-handler/dist/
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt TelemetryHandlerRole.Arn
      Environment:
        Variables:
          STAGE: !Ref Stage
          DEVICES_TABLE: !Ref DevicesTable
          TELEMETRY_TABLE: !Ref TelemetryTable
          INCIDENTS_TABLE: !Ref IncidentsTable

  TelemetryHandlerIotPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt TelemetryHandler.Arn
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      # Compute the name without referencing the rule, so the rule can depend on
      # this permission and never become enabled before invocation is authorized.
      SourceArn: !Sub
        - arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/${RuleName}
        - RuleName: !Join
            - '_'
            - - freshguard
              - !Join ['_', !Split ['-', !Ref Stage]]
              - telemetry

  TelemetryTopicRule:
    Type: AWS::IoT::TopicRule
    DependsOn: TelemetryHandlerIotPermission
    Properties:
      RuleName: !Join
        - '_'
        - - freshguard
          - !Join ['_', !Split ['-', !Ref Stage]]
          - telemetry
      TopicRulePayload:
        Description: Route FreshGuard telemetry to the validation and state handler
        AwsIotSqlVersion: '2016-03-23'
        Sql: !Sub "SELECT * FROM 'freshguard/${Stage}/devices/+/telemetry'"
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt TelemetryHandler.Arn

  IncidentAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub freshguard-${Stage}-incident-alerts

  AlertHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/freshguard-${Stage}-alert-handler
      RetentionInDays: 7

  AlertHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IncidentAlerting
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref IncidentAlertsTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/freshguard-${Stage}-alert-handler:log-stream:*

  AlertHandler:
    Type: AWS::Serverless::Function
    DependsOn: AlertHandlerLogGroup
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: !Sub freshguard-${Stage}-alert-handler
      CodeUri: ../services/alert-handler/dist/
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt AlertHandlerRole.Arn
      Environment:
        Variables:
          STAGE: !Ref Stage
          INCIDENTS_TABLE: !Ref IncidentsTable
          ALERT_TOPIC_ARN: !Ref IncidentAlertsTopic
          NOTIFICATION_CLAIM_LEASE_SECONDS: '60'

  AlertHandlerEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AlertHandler.Arn
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/freshguard-${Stage}-incident-opened

  IncidentOpenedAlertRule:
    Type: AWS::Events::Rule
    DependsOn: AlertHandlerEventPermission
    Properties:
      Name: !Sub freshguard-${Stage}-incident-opened
      Description: Route FreshGuard incident opening events to the Alert Handler
      State: ENABLED
      EventPattern:
        source:
          - freshguard.incidents
        detail-type:
          - freshguard.incident.opened
      Targets:
        - Arn: !GetAtt AlertHandler.Arn
          Id: AlertHandler

  ReadHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Ref AllowedWebOrigins
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 600

  ReadApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/freshguard-${Stage}-read-api
      RetentionInDays: 7

  ReadApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadApiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt DevicesTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt TelemetryTable.Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${IncidentsTable.Arn}/index/ByDeviceOpenedAt
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/freshguard-${Stage}-read-api:log-stream:*

  ReadApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ReadApiLogGroup
    Metadata:
      SkipBuild: true
    Properties:
      FunctionName: !Sub freshguard-${Stage}-read-api
      CodeUri: ../services/read-api/dist/
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ReadApiRole.Arn
      Environment:
        Variables:
          STAGE: !Ref Stage
          DEVICES_TABLE: !Ref DevicesTable
          TELEMETRY_TABLE: !Ref TelemetryTable
          INCIDENTS_TABLE: !Ref IncidentsTable
          INCIDENTS_BY_DEVICE_INDEX: ByDeviceOpenedAt
          ALLOWED_WEB_ORIGINS: !Join [',', !Ref AllowedWebOrigins]
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadHttpApi
            Path: /health
            Method: GET
        Devices:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadHttpApi
            Path: /devices
            Method: GET
        DeviceDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadHttpApi
            Path: /devices/{deviceId}
            Method: GET
        DeviceTelemetry:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadHttpApi
            Path: /devices/{deviceId}/telemetry
            Method: GET
        DeviceIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadHttpApi
            Path: /devices/{deviceId}/incidents
            Method: GET
        IncidentDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadHttpApi
            Path: /incidents/{incidentId}
            Method: GET

Outputs:
  DevicesTableName:
    Value: !Ref DevicesTable
  TelemetryTableName:
    Value: !Ref TelemetryTable
  IncidentsTableName:
    Value: !Ref IncidentsTable
  TelemetryHandlerArn:
    Value: !GetAtt TelemetryHandler.Arn
  TelemetryHandlerName:
    Value: !Ref TelemetryHandler
  AlertHandlerName:
    Value: !Ref AlertHandler
  IncidentAlertsTopicArn:
    Value: !Ref IncidentAlertsTopic
  IncidentAlertsTopicName:
    Value: !GetAtt IncidentAlertsTopic.TopicName
  ReadApiFunctionName:
    Value: !Ref ReadApiFunction
  ReadApiUrl:
    Description: Set this value as NEXT_PUBLIC_API_BASE_URL in the dashboard
    Value: !Sub https://${ReadHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}
  IoTTopicRuleName:
    Value: !Ref TelemetryTopicRule
  MqttTelemetryTopic:
    Value: !Sub freshguard/${Stage}/devices/cold-room-01/telemetry
  MqttTelemetryTopicFilter:
    Value: !Sub freshguard/${Stage}/devices/+/telemetry
